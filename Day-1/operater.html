<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operaters</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 3;

        document.write(a + b);
        console.log(a - b);
        alert(a * b);
        console.log(a / b);
        console.log(a % b);

    </script>
</body>
</html>
